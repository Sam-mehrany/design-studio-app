<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Design Studio</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('design.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* Same tokens as styles.css: seamed neutral ladder, ink as the only emphasis, hairlines. */
  :root {
    color-scheme: light;
    --surface: #f7f8f9; --surface-2: #ffffff; --sunken: #eef1f4;
    --line: #e1e4e8; --line-strong: #cdd2d8;
    --ink: #0b0c0d; --ink-2: #4f5358; --ink-3: #676b71; --on-ink: #ffffff;
    --bad-fg: #a3363a; --hatch: rgba(11, 12, 13, 0.07);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: Inter, -apple-system, "Segoe UI", Helvetica, Arial, IRANSans, Vazirmatn, Tahoma, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #151618; --surface-2: #1c1d20; --sunken: #0f1012;
    --line: #26282c; --line-strong: #363a40;
    --ink: #f2f3f4; --ink-2: #a8acb2; --ink-3: #8e9298; --on-ink: #0b0c0d;
    --bad-fg: #f0a3a3; --hatch: rgba(242, 243, 244, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font: 14px/1.5 var(--sans);
    display: grid; place-items: center; padding: 24px;
    background-color: var(--sunken);
    background-image: repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 8px);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.08);
  }
  .brand { display: flex; align-items: center; height: 60px; padding: 0 28px; border-bottom: 1px solid var(--line); }
  .brand b { font-size: 17px; font-weight: 700; letter-spacing: 0.06em; }
  .brand span { margin-left: auto; font: 11px var(--mono); color: var(--ink-3); }
  .body { padding: 28px; }
  h1 { font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 600; }
  p.sub { margin: 0 0 24px; color: var(--ink-2); }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
  .field { position: relative; }
  input {
    width: 100%; height: 44px; padding: 0 48px 0 16px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--ink);
    font: inherit; outline: none; transition: border-color 120ms ease;
  }
  input:focus { border-color: var(--ink); }
  input[aria-invalid="true"] { border-color: var(--bad-fg); }
  .peek {
    position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center;
  }
  .peek:hover { color: var(--ink); background: var(--sunken); }
  .err { min-height: 20px; margin: 8px 0 14px; color: var(--bad-fg); font-size: 13px; }
  button[type="submit"] {
    width: 100%; height: 44px; border: 0; border-radius: 999px; background: var(--ink);
    color: var(--on-ink); font: 600 14px var(--sans); cursor: pointer; transition: opacity 120ms ease;
  }
  button[type="submit"]:hover { opacity: .88; }
  button[type="submit"]:disabled { opacity: .6; cursor: default; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .foot { padding: 14px 28px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><b>STUDIO</b><span>design library</span></div>
    <div class="body">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your reference library.</p>
    <form id="f" novalidate>
      <label for="pw">Password</label>
      <div class="field">
        <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
        <button class="peek" type="button" id="peek" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="go">Sign in</button>
    </form>
    </div>
    <div class="foot">Stays signed in for 30 days on this device</div>
  </main>
<script>
  const f = document.getElementById('f'), pw = document.getElementById('pw');
  const err = document.getElementById('err'), go = document.getElementById('go');
  document.getElementById('peek').onclick = (e) => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    pw.focus();
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    err.textContent = ''; pw.removeAttribute('aria-invalid');
    if (!pw.value) { err.textContent = 'Enter your password.'; pw.setAttribute('aria-invalid', 'true'); return; }
    go.disabled = true; go.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' },
        body: JSON.stringify({ password: pw.value }),
      });
      const b = await r.json().catch(() => ({}));
      if (r.ok && b.ok) {
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.replace(next.startsWith('/') && !next.startsWith('//') ? next : '/');
        return;
      }
      err.textContent = b.error || 'Sign-in failed.';
      pw.setAttribute('aria-invalid', 'true'); pw.select();
    } catch { err.textContent = 'Could not reach the studio.'; }
    go.disabled = false; go.textContent = 'Sign in';
  };
</script>
</body>
</html>
