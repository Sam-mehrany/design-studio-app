<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Design Studio</title>
<style>
  /* Same tokens as styles.css: dark surface ladder, one orange accent, hairline borders. */
  :root {
    --rail: #0f0f0f; --bg: #1b1b1d; --surface-3: #242426;
    --on-surface: #f2f2f3; --on-surface-muted: #9a9a9c; --on-surface-faint: #8e8e90;
    --border: #2a2a2c; --border-strong: #3a3a3e;
    --accent: #ff6b00; --on-accent: #141414; --danger: #e04f4f;
    --radius: 10px; --radius-lg: 14px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: Inter, -apple-system, "Segoe UI", Helvetica, Arial, IRANSans, Vazirmatn, Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--rail); color: var(--on-surface); font: 14px/1.5 var(--sans);
    display: grid; place-items: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px 28px 28px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .mark {
    width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: var(--on-accent); font-weight: 700; font-size: 15px;
  }
  .brand b { font-size: 15px; letter-spacing: -0.01em; }
  h1 { font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 600; }
  p.sub { margin: 0 0 24px; color: var(--on-surface-muted); }
  label { display: block; font-size: 12px; color: var(--on-surface-muted); margin-bottom: 6px; }
  .field { position: relative; }
  input {
    width: 100%; height: 44px; padding: 0 44px 0 14px; border-radius: var(--radius);
    background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--on-surface);
    font: inherit; outline: none; transition: border-color 120ms ease;
  }
  input:focus { border-color: var(--accent); }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .peek {
    position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border: 0; border-radius: 8px;
    background: transparent; color: var(--on-surface-faint); cursor: pointer; display: grid; place-items: center;
  }
  .peek:hover { color: var(--on-surface); background: #2b2b2d; }
  .err { min-height: 20px; margin: 8px 0 14px; color: var(--danger); font-size: 13px; }
  button[type="submit"] {
    width: 100%; height: 44px; border: 0; border-radius: var(--radius); background: var(--accent);
    color: var(--on-accent); font: 600 14px var(--sans); cursor: pointer; transition: filter 120ms ease;
  }
  button[type="submit"]:hover { filter: brightness(1.08); }
  button[type="submit"]:disabled { opacity: .6; cursor: default; }
  .foot { margin-top: 22px; font: 11px var(--mono); color: var(--on-surface-faint); text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="mark" aria-hidden="true">S</div><b>Design Studio</b></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your reference library.</p>
    <form id="f" novalidate>
      <label for="pw">Password</label>
      <div class="field">
        <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
        <button class="peek" type="button" id="peek" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="go">Sign in</button>
    </form>
    <div class="foot">Stays signed in for 30 days on this device</div>
  </main>
<script>
  const f = document.getElementById('f'), pw = document.getElementById('pw');
  const err = document.getElementById('err'), go = document.getElementById('go');
  document.getElementById('peek').onclick = (e) => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    pw.focus();
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    err.textContent = ''; pw.removeAttribute('aria-invalid');
    if (!pw.value) { err.textContent = 'Enter your password.'; pw.setAttribute('aria-invalid', 'true'); return; }
    go.disabled = true; go.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' },
        body: JSON.stringify({ password: pw.value }),
      });
      const b = await r.json().catch(() => ({}));
      if (r.ok && b.ok) {
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.replace(next.startsWith('/') && !next.startsWith('//') ? next : '/');
        return;
      }
      err.textContent = b.error || 'Sign-in failed.';
      pw.setAttribute('aria-invalid', 'true'); pw.select();
    } catch { err.textContent = 'Could not reach the studio.'; }
    go.disabled = false; go.textContent = 'Sign in';
  };
</script>
</body>
</html>
