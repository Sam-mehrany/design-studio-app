<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Studio</b><span id="root">—</span></div>
    <nav>
      <button data-view="gallery" aria-current="true">Gallery</button>
      <button data-view="graph">Graph</button>
      <button data-view="queue">Queue</button>
      <button data-view="candidates">Candidates</button>
      <button data-view="inbox">Inbox</button>
    </nav>
    <div class="stats" id="stats"></div>
  </header>
  <main id="main"></main>
</div>

<div class="drop-hint"><div>Drop images to add them to the inbox</div></div>
<script src="app.js"></script>
</body>
</html>
